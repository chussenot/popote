# cocogitto: Conventional Commits checks, changelog and version bumps.
# https://docs.cocogitto.io — `mise run commits:check`, `mise run release`.
from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false
tag_prefix = "v"
# The tag is what triggers .github/workflows/release.yml, which refuses to
# publish unless the tag matches the crate version. Keep them in step here:
# rewrite the package version, refresh Cargo.lock, and prove the crate still
# packages before cog commits and tags.
pre_bump_hooks = [
  "python3 scripts/set-crate-version.py crates/popote/Cargo.toml {{version}}",
  "cargo check --workspace --quiet",
  "cargo publish --dry-run --allow-dirty --quiet -p popote",
]
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
template = "remote"
remote = "github.com"
repository = "popote"
owner = "chussenot"
path = "CHANGELOG.md"
authors = []

[bump_profiles]
