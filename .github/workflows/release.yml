# Publish the crate to crates.io when a v* tag is pushed (`mise run release`
# creates the tag with cocogitto). Authentication is crates.io trusted
# publishing: GitHub mints an OIDC token for this workflow, crates.io exchanges
# it for a short-lived publish token, and the token is revoked when the job
# ends. No long-lived crates.io secret exists anywhere.
#
# One-time setup, documented in docs/how-to/release-the-crate.md: publish the
# first version by hand, then add this repository, this workflow file and the
# `release` environment as a trusted publisher on crates.io.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Named so crates.io can require it, and so it can carry protection rules
    # (required reviewers) in the repository settings.
    environment: release
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # request the OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install_args: python ruff shellcheck rust cocogitto

      - name: Tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "popote"))')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/popote/Cargo.toml version $crate"
            exit 1
          fi

      - name: Quality gate
        run: mise run check

      - name: Authenticate to crates.io
        id: auth
        # Pinned by commit: this step mints publish credentials. v1.0.5.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish
        run: cargo publish --locked -p popote
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: GitHub Release
        run: |
          cog changelog --at "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
